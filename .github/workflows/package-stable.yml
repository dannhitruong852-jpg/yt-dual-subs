name: Package stable position-only extension

on:
  push:
    branches:
      - stable-position-only-package
  workflow_dispatch:

jobs:
  chrome-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify position-only baseline
        run: |
          test -f independent-position.js
          test -f independent-position.css
          test ! -f vocab-runtime.js
          test ! -f vocab-levels.js
          grep -q 'independent-position.js' manifest.json
          grep -q 'independent-position.css' manifest.json
      - name: Build Chrome ZIP
        run: |
          mkdir -p dist/yt-dual-subs-position-only
          rsync -a ./ dist/yt-dual-subs-position-only/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          cd dist
          zip -qr yt-dual-subs-position-only-chrome.zip yt-dual-subs-position-only
      - uses: actions/upload-artifact@v4
        with:
          name: yt-dual-subs-position-only-chrome
          path: dist/yt-dual-subs-position-only-chrome.zip
          retention-days: 90

  safari-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify position-only baseline
        run: |
          test -f independent-position.js
          test -f independent-position.css
          test ! -f vocab-runtime.js
          test ! -f vocab-levels.js
          grep -q 'independent-position.js' manifest.json
          grep -q 'independent-position.css' manifest.json
      - name: Prepare Safari extension source
        run: |
          mkdir -p dist/safari-source
          rsync -a ./ dist/safari-source/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
      - name: Build Safari Xcode projects
        run: |
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            PACKAGER=safari-web-extension-packager
          else
            PACKAGER=safari-web-extension-converter
          fi
          xcrun "$PACKAGER" dist/safari-source \
            --project-location "$PWD/dist/safari-macos" \
            --app-name "YT Dual Subs" \
            --bundle-identifier "com.dannhitruong852.ytdualsubs.position.macos" \
            --swift --copy-resources --no-open --no-prompt --force --macos-only
          xcrun "$PACKAGER" dist/safari-source \
            --project-location "$PWD/dist/safari-ios" \
            --app-name "YT Dual Subs" \
            --bundle-identifier "com.dannhitruong852.ytdualsubs.position.ios" \
            --swift --copy-resources --no-open --no-prompt --force --ios-only
          ditto -c -k --sequesterRsrc --keepParent dist/safari-macos dist/yt-dual-subs-position-only-safari-macos-xcode.zip
          ditto -c -k --sequesterRsrc --keepParent dist/safari-ios dist/yt-dual-subs-position-only-safari-ios-xcode.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yt-dual-subs-position-only-safari
          path: |
            dist/yt-dual-subs-position-only-safari-macos-xcode.zip
            dist/yt-dual-subs-position-only-safari-ios-xcode.zip
          retention-days: 90
